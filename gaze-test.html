<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spectral gaze test</title>
  <style>
    body {
      margin: 0;
      background: #10121b;
      color: white;
      font-family: sans-serif;
    }

    #controls {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
    }

    .target {
      position: fixed;
      z-index: 20; /* Keep calibration dots above the camera preview. */
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #8fd3ff;
      border: 2px solid white;
      transform: translate(-50%, -50%);
      cursor: pointer;
    }

    #webgazerVideoContainer {
      z-index: 1;
      pointer-events: none;
    }

    #webgazerGazeDot {
      pointer-events: none;
    }

    #error-details {
      max-width: 85vw;
      max-height: 35vh;
      overflow: auto;
      white-space: pre-wrap;
      text-align: left;
      font-size: 12px;
    }
    #gaze-pointer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 110;
      pointer-events: none;
    }
  </style>
  <script src="./src/webgazer.js" type="text/javascript"></script>
  <link rel="stylesheet" href="css/gaze-calibration.css">
</head>
<body>
  <div id="controls">
    <button id="start">Start eye tracking</button>
    <button id="recalibrate" hidden>Recalibrate</button>
    <p id="status">Allow the camera when prompted.</p>
    <p id="gaze-readout" hidden></p>
    <pre id="error-details" hidden></pre>
  </div>

  <script type="module">
    import { initGaze, calibrateGaze, updateGaze, gaze } from './src/gaze.js';
    import { initGazePointer, drawGazePointer } from './src/gaze-pointer.js';
    const status = document.querySelector('#status');
    const start = document.querySelector('#start');
    const recalibrate = document.querySelector('#recalibrate');
    const readout = document.querySelector('#gaze-readout');
    const details = document.querySelector('#error-details');
    initGazePointer();
    function render(now) {
      updateGaze(now, innerWidth);
      drawGazePointer(gaze, now);
      if (gaze.calibrated) readout.textContent = gaze.tracking
        ? `Estimated gaze: ${Math.round(gaze.x)}, ${Math.round(gaze.y)} pixels`
        : 'Waiting for your eyes…';
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
    async function begin() {
      start.disabled = recalibrate.disabled = true;
      details.hidden = true;
      try {
        await initGaze(text => { status.textContent = text; });
        await calibrateGaze();
        status.textContent = 'Calibration complete. Look around to test the glowing pointer.';
        start.hidden = true;
        recalibrate.hidden = readout.hidden = false;
      } catch (error) {
        status.textContent = `Could not calibrate: ${error.message}`;
        details.textContent = error.stack || String(error);
        details.hidden = false;
      } finally {
        start.disabled = recalibrate.disabled = false;
      }
    }
    start.addEventListener('click', begin);
    recalibrate.addEventListener('click', begin);
  </script>
</body>
</html>
